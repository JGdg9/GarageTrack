name: GarageTrack CI and delivery

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Check application quality
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: garage-test-password
          MYSQL_DATABASE: garagetrack_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=TCP --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql+pymysql://root:garage-test-password@127.0.0.1:3306/garagetrack
      TEST_DATABASE_URL: mysql+pymysql://root:garage-test-password@127.0.0.1:3306/garagetrack_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Check Python style
        run: python -m ruff format --check .
      - name: Check Python code
        run: python -m ruff check .
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check
      - name: Check JavaScript
        working-directory: frontend
        run: npm run lint
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Run unit tests
        run: python -m pytest backend/tests/unit
      - name: Run MySQL integration tests
        run: python -m pytest backend/tests/integration
  delivery:
    name: Package verified source
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check tracked files for local data
        run: |
          forbidden_files=$(git ls-tree -r --name-only "$GITHUB_SHA" | grep -E '(^|/)\.env($|\.)|(^|/)\.local/|(^|/)\.venv/|(^|/)node_modules/|\.(pem|p12|pfx|jks|keystore|key|sqlite|sqlite3|db)$' | grep -Ev '(^|/)\.env\.example$' || true)
          if [ -n "$forbidden_files" ]; then
            printf '%s\n' "$forbidden_files"
            exit 1
          fi
      - name: Create source archive
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/GarageTrack-${GITHUB_SHA}.zip" "$GITHUB_SHA"
      - name: Upload delivery package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: GarageTrack-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90
