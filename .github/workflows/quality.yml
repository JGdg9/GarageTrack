name: GarageTrack CI and delivery

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Check application quality
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: garage-test-password
          MYSQL_DATABASE: garagetrack_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=TCP --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql+pymysql://root:garage-test-password@127.0.0.1:3306/garagetrack
      TEST_DATABASE_URL: mysql+pymysql://root:garage-test-password@127.0.0.1:3306/garagetrack_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --requirement backend/requirements.txt
      - name: Check Python style
        run: python -m ruff format --check .
      - name: Check Python code
        run: python -m ruff check .
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check
      - name: Check JavaScript
        working-directory: frontend
        run: npm run lint
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Run unit tests
        run: python -m pytest backend/tests/unit
      - name: Run MySQL integration tests
        run: python -m pytest backend/tests/integration
      - name: Build the public demo container
        run: docker build --tag garagetrack:check .
      - name: Build the Render demo container
        run: docker build --file Dockerfile.render --tag garagetrack:render-check .
      - name: Verify the Render demo container
        run: |
          docker run --detach --name garagetrack-render-check --publish 127.0.0.1:18080:10000 garagetrack:render-check
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:18080/api/v1/statistics > /tmp/garagetrack-statistics.json; then
              break
            fi
            sleep 2
          done
          if [ ! -s /tmp/garagetrack-statistics.json ]; then
            docker logs garagetrack-render-check
            exit 1
          fi
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base_url = "http://127.0.0.1:18080"
          with urllib.request.urlopen(f"{base_url}/health") as response:
              assert json.load(response)["status"] == "ok"
          with urllib.request.urlopen(f"{base_url}/api/v1/config") as response:
              assert json.load(response)["demo_read_only"] is True
          with urllib.request.urlopen(f"{base_url}/api/v1/statistics") as response:
              statistics = json.load(response)
          assert statistics["total_vehicles"] == 2
          assert statistics["total_maintenance_records"] == 3
          assert statistics["total_expenses"] == "890.40"
          request = urllib.request.Request(
              f"{base_url}/api/v1/vehicles",
              data=b'{"brand":"Demo","model":"Vehicle","year":2024,"current_mileage":0}',
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request)
          except urllib.error.HTTPError as error:
              assert error.code == 403
          else:
              raise AssertionError("The public demo accepted a write request.")
          PY
      - name: Remove the Render demo container
        if: always()
        run: docker rm --force garagetrack-render-check 2>/dev/null || true
  delivery:
    name: Package verified source
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check tracked files for local data
        run: |
          forbidden_files=$(git ls-tree -r --name-only "$GITHUB_SHA" | grep -E '(^|/)\.env($|\.)|(^|/)\.local/|(^|/)\.venv/|(^|/)node_modules/|\.(pem|p12|pfx|jks|keystore|key|sqlite|sqlite3|db)$' | grep -Ev '(^|/)\.env\.example$' || true)
          if [ -n "$forbidden_files" ]; then
            printf '%s\n' "$forbidden_files"
            exit 1
          fi
      - name: Create source archive
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/GarageTrack-${GITHUB_SHA}.zip" "$GITHUB_SHA"
      - name: Upload delivery package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: GarageTrack-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90
